# Lefthook configuration
# Follows SOLID/GRASP: automated quality gates ensure consistency

pre-commit:
  parallel: true
  commands:
    lint:
      glob: 'src/**/*.ts'
      run: npx eslint {staged_files} --fix
      stage_fixed: true

    format:
      glob: 'src/**/*.ts'
      run: npx prettier --write {staged_files}
      stage_fixed: true

    type-check:
      run: npx tsc --noEmit

    test:
      glob: 'src/**/*.test.ts'
      run: npm test -- --run {staged_files}

commit-msg:
  commands:
    validate-message:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    # Real-engine playtest harness (Vitest, fast ~3 s): boots the REAL GameEngine +
    # real systems and drives behaviour scenarios through the journeys that keep
    # breaking (combat, new-game reset, local-delivery, save-load), asserting
    # observable state + zero logged/thrown errors. Distinct from full-test so an
    # integration/wiring break fails with a clear, fast signal — the gap unit tests
    # (which mock the seams) can't catch. See docs/plans/20260623-real-engine-playtest-harness.md.
    playtest:
      run: npm run test:playtest
    # Save-compatibility safety net (Vitest, fast ~2 s): replays the frozen
    # golden-save corpus (incl. genuinely old versions) through validate →
    # migrate → re-validate → engine load, and asserts load-time loadout
    # revalidation re-homes over-capacity gear instead of bricking the save.
    # A distinct gate so a save-breaking schema/catalog change fails with a
    # clear signal — before it reaches a beta-tester's progressed save.
    # See docs/plans/20260625-save-compatibility-safety-net.md.
    save-compat:
      run: npm run test:save-compat
    full-test:
      run: npm test -- --run
    full-lint:
      run: npm run lint
    build:
      run: npm run build
