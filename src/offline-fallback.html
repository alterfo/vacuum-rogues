<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вакуумные Пройдохи</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Courier New', monospace;
      background-color: #000510;
      color: #00ffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    
    .container {
      max-width: 600px;
    }
    
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      letter-spacing: 4px;
      color: #00ffff;
    }
    
    p {
      font-size: 18px;
      line-height: 1.6;
      color: #88ccff;
      margin-bottom: 20px;
    }
    
    .warning {
      background-color: rgba(255, 170, 0, 0.2);
      border: 1px solid #ffaa00;
      padding: 20px;
      border-radius: 8px;
      margin-top: 30px;
    }
    
    .warning-icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>ВАКУУМНЫЕ ПРОЙДОХИ</h1>
    
    <p>Добро пожаловать в космическую RPG нового поколения.</p>
    
    <div class="warning">
      <div class="warning-icon">⚠️</div>
      <p><strong>Требуется подключение для первой загрузки игры.</strong></p>
      <p>После загрузки вы сможете играть офлайн.</p>
      <p style="margin-top: 15px; font-size: 14px; color: #ffaa00;">
        Пожалуйста, проверьте подключение к интернету и перезагрузите страницу.
      </p>
    </div>
  </div>
</body>
</html>
