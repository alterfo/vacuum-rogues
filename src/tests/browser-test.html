<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Test - Space Rangers</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: #0ff;
      font-family: 'Courier New', monospace;
    }
    #results {
      margin-top: 20px;
      padding: 10px;
      background: #222;
      border-radius: 5px;
    }
    .pass { color: #0f0; }
    .fail { color: #f00; }
    button {
      padding: 10px 20px;
      background: #00aaff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
    }
    button:hover {
      background: #0088cc;
    }
  </style>
</head>
<body>
  <h1>Space Rangers - Browser Test</h1>
  <div id="controls">
    <button onclick="testIndexedDB()">Test IndexedDB</button>
    <button onclick="testWorker()">Test Web Worker</button>
    <button onclick="testCanvas()">Test Canvas</button>
    <button onclick="runAllTests()">Run All Tests</button>
  </div>
  <div id="results"></div>

  <script type="module">
    const results = document.getElementById('results');

    function log(message, status = 'pass') {
      const line = document.createElement('div');
      line.className = status;
      line.textContent = `[${status.toUpperCase()}] ${message}`;
      results.appendChild(line);
    }

    window.testIndexedDB = async () => {
      results.innerHTML = '';
      try {
        const request = indexedDB.open('SpaceRangersCache', 1);
        await new Promise((resolve, reject) => {
          request.onsuccess = () => {
            request.result.close();
            resolve();
          };
          request.onerror = () => reject(request.error);
        });
        log('IndexedDB: Accessible');
        return true;
      } catch (e) {
        log(`IndexedDB: Failed - ${e.message}`, 'fail');
        return false;
      }
    };

    window.testWorker = () => {
      results.innerHTML = '';
      try {
        const worker = new Worker('/src/ai/inference.worker.ts', { type: 'module' });
        worker.postMessage({ id: 'test', data: { input: { data: [], dims: [], type: 'float32', typedArrayName: 'Float32Array' } } });
        worker.onmessage = (e) => {
          log('Web Worker: Loaded successfully');
          worker.terminate();
        };
        worker.onerror = (e) => {
          log(`Web Worker: Failed - ${e.message}`, 'fail');
          worker.terminate();
        };
        return true;
      } catch (e) {
        log(`Web Worker: Failed - ${e.message}`, 'fail');
        return false;
      }
    };

    window.testCanvas = () => {
      results.innerHTML = '';
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 800;
        canvas.height = 600;
        const ctx = canvas.getContext('2d');
        if (!ctx) throw new Error('2D context not available');
        ctx.fillStyle = '#000510';
        ctx.fillRect(0, 0, 800, 600);
        ctx.fillStyle = '#00ffff';
        ctx.fillText('Canvas Test OK', 350, 300);
        document.body.appendChild(canvas);
        setTimeout(() => canvas.remove(), 2000);
        log('Canvas: Working correctly');
        return true;
      } catch (e) {
        log(`Canvas: Failed - ${e.message}`, 'fail');
        return false;
      }
    };

    window.runAllTests = async () => {
      results.innerHTML = '';
      log('Starting all tests...');
      await testIndexedDB();
      await testWorker();
      await testCanvas();
      log('All tests completed');
    };
  </script>
</body>
</html>
