# Lefthook configuration
# Follows SOLID/GRASP: automated quality gates ensure consistency

pre-commit:
  parallel: true
  commands:
    lint:
      glob: 'src/**/*.ts'
      run: npx eslint {staged_files} --fix
      stage_fixed: true

    format:
      glob: 'src/**/*.ts'
      run: npx prettier --write {staged_files}
      stage_fixed: true

    type-check:
      run: npx tsc --noEmit

    test:
      glob: 'src/**/*.test.ts'
      run: npm test -- --run {staged_files}

commit-msg:
  commands:
    validate-message:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    full-test:
      run: npm test -- --run
    full-lint:
      run: npm run lint
    build:
      run: npm run build
